name: decision026-lane03-adversarial

on:
  pull_request:
    paths:
      - "tests/test_integration_candidate_binding_adversarial.py"
      - ".github/workflows/decision026-lane03-adversarial.yml"
      - "coordination/returns/03/**"

permissions:
  contents: read

jobs:
  decision026-lane03-adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "jsonschema>=4.0,<5"
      - name: Pin Lane 02 exact Decision 026 surface
        shell: bash
        run: |
          test "$(git rev-parse HEAD:axm_institution/integration_candidate_binding.py)" = "3f36578a4e45acff252d185592e13d5a626563b9"
          test "$(git rev-parse HEAD:axm_institution/packet_integration_eligibility.py)" = "44aaa962d34e67fd4917d1d7e9fd3615c2f3051b"
          test "$(git rev-parse HEAD:axm_institution/store.py)" = "0ccc5bea45af0e1e4ab343720cd11810a4a3caba"
          test "$(git rev-parse HEAD:tests/test_integration_candidate_binding.py)" = "dc233a61346e580e67bf974b0e79afa513347486"
          test "$(git rev-parse HEAD:.github/workflows/decision026-integration-candidate-binding.yml)" = "8074daadc9c7bc080815be204ca3a741649d1d56"
      - name: Re-run Lane 02 Decision 026 baseline unchanged
        run: python -m unittest discover -s tests -p "test_integration_candidate_binding.py" -v
      - name: Run Lane 03 Decision 026 adversarial check
        run: python -m unittest discover -s tests -p "test_integration_candidate_binding_adversarial.py" -v
      - name: Keep Decision 025 receipt identity green
        run: python -m unittest discover -s tests -p "test_integration_receipt_identity.py" -v
      - name: Keep Decision 024 packet eligibility green
        run: python -m unittest discover -s tests -p "test_packet_integration_eligibility*.py" -v
      - name: Run complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Explicitly compile attacked surface
        run: python -m py_compile axm_institution/integration_candidate_binding.py tests/test_integration_candidate_binding.py tests/test_integration_candidate_binding_adversarial.py
      - name: Compile deterministic kernel sources and tests
        run: python -m compileall -q axm_institution tests
