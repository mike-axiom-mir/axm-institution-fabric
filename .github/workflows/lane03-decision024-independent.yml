name: lane03-decision024-independent

on:
  pull_request:
    paths:
      - "axm_institution/packet_integration_eligibility.py"
      - "axm_institution/packet_artifact_provenance.py"
      - "tests/test_packet_integration_eligibility.py"
      - "tests/test_packet_integration_eligibility_v04.py"
      - "tests/test_packet_integration_eligibility_adv059.py"
      - ".github/workflows/lane03-decision024-independent.yml"

permissions:
  contents: read

jobs:
  lane03-decision024-independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "jsonschema>=4.0,<5"
      - name: Run unchanged ADV-059-A oracle
        run: python -m unittest discover -s tests -p "test_packet_integration_eligibility_adv059.py" -v
      - name: Run Decision 024 baseline and continuity regressions
        run: python -m unittest discover -s tests -p "test_packet_integration_eligibility*.py" -v
      - name: Compile attacked Decision 024 surface explicitly
        run: >-
          python -m py_compile
          axm_institution/packet_integration_eligibility.py
          axm_institution/packet_artifact_provenance.py
          tests/test_packet_integration_eligibility.py
          tests/test_packet_integration_eligibility_v04.py
          tests/test_packet_integration_eligibility_adv059.py
      - name: Run complete deterministic suite
        run: python -m unittest discover -s tests -v
