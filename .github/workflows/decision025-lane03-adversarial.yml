name: decision025-lane03-adversarial

on:
  pull_request:
    paths:
      - "tests/test_integration_receipt_identity_adversarial.py"
      - ".github/workflows/decision025-lane03-adversarial.yml"
      - "coordination/returns/03/**"

permissions:
  contents: read

jobs:
  decision025-lane03-adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "jsonschema>=4.0,<5"
      - name: Pin Lane 02 exact Decision 025 surface
        shell: bash
        run: |
          test "$(git rev-parse HEAD:schemas/integration-receipt.schema.json)" = "1279f24d8500ac25712a1323390f6aa128a565da"
          test "$(git rev-parse HEAD:axm_institution/integration_receipt_identity.py)" = "89a04bc929ed0c22ba4f07dac49b1efbf05aa381"
          test "$(git rev-parse HEAD:tests/test_integration_receipt_identity.py)" = "7b56dc1a78e3a508e2278bd5f5d714118563a32a"
          test "$(git rev-parse HEAD:.github/workflows/decision025-receipt-identity.yml)" = "409d4228282d125588bf865b45dd3058fd905b94"
      - name: Run Lane 03 Decision 025 adversarial checks
        run: python -m unittest discover -s tests -p "test_integration_receipt_identity_adversarial.py" -v
      - name: Re-run Lane 02 Decision 025 baseline unchanged
        run: python -m unittest discover -s tests -p "test_integration_receipt_identity.py" -v
      - name: Keep Decision 024 packet eligibility green
        run: python -m unittest discover -s tests -p "test_packet_integration_eligibility*.py" -v
      - name: Run complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Explicitly compile attacked surface
        run: python -m py_compile axm_institution/integration_receipt_identity.py tests/test_integration_receipt_identity.py tests/test_integration_receipt_identity_adversarial.py
      - name: Compile deterministic kernel sources and tests
        run: python -m compileall -q axm_institution tests
