name: decision025-receipt-identity

on:
  pull_request:
    paths:
      - "schemas/integration-receipt.schema.json"
      - "axm_institution/integration_receipt_identity.py"
      - "tests/test_integration_receipt_identity.py"
      - ".github/workflows/decision025-receipt-identity.yml"

permissions:
  contents: read

jobs:
  decision025-receipt-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "jsonschema>=4.0,<5"
      - name: Run Decision 025 exact receipt identity tests
        run: python -m unittest discover -s tests -p "test_integration_receipt_identity.py" -v
      - name: Keep Decision 024 packet eligibility green
        run: python -m unittest discover -s tests -p "test_packet_integration_eligibility*.py" -v
      - name: Run complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Explicitly compile Decision 025 surface
        run: python -m py_compile axm_institution/integration_receipt_identity.py tests/test_integration_receipt_identity.py
      - name: Compile deterministic kernel sources and tests
        run: python -m compileall -q axm_institution tests
