name: identity-stage2

on:
  pull_request:
    paths:
      - "axm_institution/**"
      - "schemas/**"
      - "fixtures/**"
      - "tests/**"
      - ".github/workflows/identity-stage2.yml"
  push:
    branches:
      - "lane-02/activation-03-stage2-identity"
      - "lane-02/activation-08-immutable-store"
      - "lane-02/activation-09-exact-lifecycle-bases"
      - "lane-02/activation-16-occupancy-admission"
    paths:
      - "axm_institution/**"
      - "schemas/**"
      - "fixtures/**"
      - "tests/**"
      - ".github/workflows/identity-stage2.yml"

permissions:
  contents: read

jobs:
  deterministic-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "jsonschema>=4.0,<5"
      - name: Run deterministic identity tests
        run: python -m unittest discover -s tests -v
      - name: Compile deterministic kernel sources and tests
        run: python -m py_compile axm_institution/__init__.py axm_institution/identity.py axm_institution/store.py axm_institution/resolution.py axm_institution/lifecycle.py tests/test_contract_schemas.py tests/test_identity.py tests/test_identity_string_escapes.py tests/test_state_revision_membership.py tests/test_lifecycle_base_refs.py tests/test_post_base_authoritative_refs.py tests/test_store.py tests/test_revision_member_resolution.py tests/test_occupancy_admission.py tests/test_occupancy_admission_adversarial.py
