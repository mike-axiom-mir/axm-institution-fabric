name: identity-stage2

on:
  pull_request:
    paths:
      - "axm_institution/**"
      - "schemas/**"
      - "fixtures/**"
      - "tests/**"
      - ".github/workflows/identity-stage2.yml"
  push:
    branches:
      - "lane-02/activation-03-stage2-identity"
      - "lane-02/activation-08-immutable-store"
      - "lane-02/activation-09-exact-lifecycle-bases"
      - "lane-02/activation-16-occupancy-admission"
      - "lane-02/activation-20-return-packet-admission"
      - "lane-02/activation-21-packet-output-identity"
      - "lane-02/activation-29-created-artifact-provenance"
      - "lane-02/activation-30-modified-artifact-identity"
      - "lane-02/activation-31-modified-result-compatibility"
      - "lane-02/activation-32-mixed-packet-compatibility"
      - "lane-02/activation-33-exact-output-dependency-identity"
      - "lane-03/activation-032-modified-artifact-identity"
      - "lane-03/activation-033-modified-result-compatibility"
      - "lane-03/activation-034-mixed-packet-compatibility"
      - "lane-03/activation-035-output-dependency-identity"
      - "lane-01/activation-21-integrate-adv034"
    paths:
      - "axm_institution/**"
      - "schemas/**"
      - "fixtures/**"
      - "tests/**"
      - ".github/workflows/identity-stage2.yml"

permissions:
  contents: read

jobs:
  deterministic-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "jsonschema>=4.0,<5"
      - name: Run deterministic identity tests
        run: python -m unittest discover -s tests -v
      - name: Compile deterministic kernel sources and tests
        run: python -m py_compile axm_institution/__init__.py axm_institution/identity.py axm_institution/store.py axm_institution/resolution.py axm_institution/lifecycle.py axm_institution/packet_output_identity.py axm_institution/packet_evidence_subject.py axm_institution/packet_output_compatibility.py axm_institution/packet_artifact_provenance.py axm_institution/packet_modified_artifact_identity.py axm_institution/packet_modified_result_compatibility.py axm_institution/packet_mixed_compatibility.py axm_institution/packet_output_dependency_identity.py tests/test_contract_schemas.py tests/test_identity.py tests/test_identity_string_escapes.py tests/test_state_revision_membership.py tests/test_lifecycle_base_refs.py tests/test_post_base_authoritative_refs.py tests/test_store.py tests/test_revision_member_resolution.py tests/test_occupancy_admission.py tests/test_occupancy_admission_adversarial.py tests/test_work_claim_admission.py tests/test_work_claim_admission_adversarial.py tests/test_return_packet_admission.py tests/test_return_packet_admission_adversarial.py tests/test_packet_output_identity.py tests/test_packet_output_identity_adversarial.py tests/test_packet_output_identity_freeze_bypass_adversarial.py tests/test_packet_output_identity_transport_adversarial.py tests/test_packet_output_identity_materialization_adversarial.py tests/test_packet_evidence_subject.py tests/test_packet_evidence_subject_adversarial.py tests/test_packet_evidence_subject_nested_continuity_adversarial.py tests/test_packet_output_compatibility.py tests/test_packet_output_compatibility_adversarial.py tests/test_packet_artifact_provenance.py tests/test_packet_artifact_provenance_adversarial.py tests/test_packet_modified_artifact_identity.py tests/test_packet_modified_artifact_identity_adversarial.py tests/test_packet_modified_result_compatibility.py tests/test_packet_modified_result_compatibility_adversarial.py tests/test_packet_mixed_compatibility.py tests/test_packet_mixed_compatibility_adversarial.py tests/test_packet_output_dependency_identity.py tests/test_packet_output_dependency_identity_adversarial.py
