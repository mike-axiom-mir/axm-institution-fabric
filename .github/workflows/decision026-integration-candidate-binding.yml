name: decision026-integration-candidate-binding

on:
  pull_request:
    paths:
      - "axm_institution/integration_candidate_binding.py"
      - "axm_institution/integration_receipt_identity.py"
      - "axm_institution/packet_integration_eligibility.py"
      - "axm_institution/store.py"
      - "tests/test_integration_candidate_binding.py"
      - "tests/test_integration_receipt_identity.py"
      - "tests/test_packet_integration_eligibility.py"
      - ".github/workflows/decision026-integration-candidate-binding.yml"

permissions:
  contents: read

jobs:
  decision026-integration-candidate-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "jsonschema>=4.0,<5"
      - name: Run Decision 026 exact stored binding tests
        run: python -m unittest discover -s tests -p "test_integration_candidate_binding.py" -v
      - name: Keep Decision 025 receipt identity green
        run: python -m unittest discover -s tests -p "test_integration_receipt_identity.py" -v
      - name: Keep Decision 024 packet eligibility green
        run: python -m unittest discover -s tests -p "test_packet_integration_eligibility*.py" -v
      - name: Run complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Explicitly compile Decision 026 surface
        run: python -m py_compile axm_institution/integration_candidate_binding.py tests/test_integration_candidate_binding.py
      - name: Compile deterministic kernel sources and tests
        run: python -m compileall -q axm_institution tests
