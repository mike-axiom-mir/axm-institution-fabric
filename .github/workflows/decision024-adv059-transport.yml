name: decision024-adv059-transport

on:
  pull_request:
    paths:
      - "axm_institution/packet_integration_eligibility.py"
      - "tests/test_packet_integration_eligibility.py"
      - "tests/test_packet_integration_eligibility_v04.py"
      - "tests/test_packet_integration_eligibility_adv059.py"
      - ".github/workflows/decision024-adv059-transport.yml"

permissions:
  contents: read

jobs:
  decision024-adv059-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "jsonschema>=4.0,<5"
      - name: Recheck Lane 02 Decision 024 baseline
        run: >-
          python -m unittest
          tests/test_packet_integration_eligibility.py
          tests/test_packet_integration_eligibility_v04.py
          -v
      - name: Run ADV-059-A named-fact transport regression
        run: python -m unittest tests/test_packet_integration_eligibility_adv059.py -v
      - name: Compile Decision 024 adversarial surface
        run: >-
          python -m py_compile
          axm_institution/packet_integration_eligibility.py
          tests/test_packet_integration_eligibility.py
          tests/test_packet_integration_eligibility_v04.py
          tests/test_packet_integration_eligibility_adv059.py
