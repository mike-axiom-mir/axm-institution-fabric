name: lane03-decision024-adv059ab-verification

on:
  pull_request:
    paths:
      - "axm_institution/packet_integration_eligibility.py"
      - "axm_institution/packet_artifact_provenance.py"
      - "tests/test_packet_integration_eligibility.py"
      - "tests/test_packet_integration_eligibility_v04.py"
      - "tests/test_packet_integration_eligibility_adv059.py"
      - "tests/test_packet_integration_eligibility_adv059_materialization.py"
      - ".github/workflows/lane03-decision024-adv059ab-verification.yml"

permissions:
  contents: read

jobs:
  lane03-decision024-adv059ab-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "jsonschema>=4.0,<5"
      - name: Verify unchanged ADV-059-A and ADV-059-B oracle blobs
        run: |
          test "$(git hash-object tests/test_packet_integration_eligibility_adv059.py)" = "af11f560c1dde95f508d58872270778a9f91dec5"
          test "$(git hash-object tests/test_packet_integration_eligibility_adv059_materialization.py)" = "680cfdb04c3ffb24e07a78ca7984824a673e31f3"
      - name: Run unchanged ADV-059-A and ADV-059-B
        run: >-
          python -m unittest -v
          tests.test_packet_integration_eligibility_adv059
          tests.test_packet_integration_eligibility_adv059_materialization
      - name: Run Decision 024 targeted regressions
        run: python -m unittest discover -s tests -p "test_packet_integration_eligibility*.py" -v
      - name: Compile attacked Decision 024 surface
        run: >-
          python -m py_compile
          axm_institution/packet_integration_eligibility.py
          axm_institution/packet_artifact_provenance.py
          tests/test_packet_integration_eligibility.py
          tests/test_packet_integration_eligibility_v04.py
          tests/test_packet_integration_eligibility_adv059.py
          tests/test_packet_integration_eligibility_adv059_materialization.py
      - name: Run complete deterministic unittest discovery
        run: python -m unittest discover -s tests -p "test*.py" -v
      - name: Compile deterministic Python surface
        run: python -m compileall -q axm_institution tests
